# Render Blueprint — PSAU Quality Management System (QMS)
# Docs: https://render.com/docs/blueprint-spec
# This file lets you deploy via "New -> Blueprint" and auto-creates the service.
# Alternatively, deploy manually via "New -> Web Service" and set the same values in the dashboard.

services:
  - type: web
    name: psauqms          # service name -> https://psauqms.onrender.com
    runtime: node
    plan: free            # change to starter/pro if you need more RAM or no spin-down
    branch: main
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true      # auto-deploy on git push to `main`
    envVars:
      - key: NODE_ENV
        value: production
      # Public URL of the deployed service (used for absolute links in emails/logs)
      - key: BASE_URL
        value: https://psauqms.onrender.com
      # Render injects PORT automatically; do not hardcode it here.
      # --- Required secrets — set these in Render Dashboard -> Environment ---
      # Generate SESSION_SECRET:  node -e "console.log(require('crypto').randomBytes(32).toString('hex'))"
      - key: SESSION_SECRET
        sync: false
      - key: FIREBASE_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 465         # NOTE: Render Free blocks outbound SMTP (25/465/587) — Brevo HTTPS is used for email
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      # Brevo HTTPS API (Render Free safe — uses 443, not blocked like SMTP)
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        value: bonustimoy@gmail.com
      - key: BREVO_SENDER_NAME
        value: PSAU Feedback System
      # JSON stringified serviceAccountKey.json — see notes below
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false

# NOTES
# - The service name above ("psauqms") determines the default URL:
#   https://psauqms.onrender.com
# - Set all `sync: false` secrets in Render Dashboard -> Environment on first deploy.
# - FIREBASE_SERVICE_ACCOUNT must be the ONE-LINE JSON of serviceAccountKey.json:
#   node -e "console.log(JSON.stringify(require('./serviceAccountKey.json')))"
# - Render Free blocks outbound SMTP ports 25/465/587. Email relies on BREVO_API_KEY
#   (HTTPS API on port 443); SMTP is only a fallback for paid instances.
